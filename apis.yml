aid: kktv5
name: KK直播 (KK Live)
description: >-
  KK直播 (KK Live) is a Chinese mobile-first video livestreaming and social
  entertainment platform operated by 杭州米络文化传播有限公司 (Hangzhou Melot Culture
  Communication Co., Ltd.), part of 米络星集团 (Melot Group), headquartered in
  Hangzhou with offices in Beijing, Changsha, Xi'an, Shenyang, Los Angeles and
  Mumbai. Founded in 2012 to fill the gap in mobile livestreaming variety shows,
  the platform pairs talent and performance streaming with interactive social
  features — virtual gifting, bullet comments (弹幕), multi-person live
  connections, PK mini-games, karaoke rooms, outdoor streaming and paid
  companionship. The company reports more than 100,000 independent streamers,
  over 600 partner talent agencies and 150 million registered users. Melot Group
  runs three business lines — entertainment livestreaming, online education and
  video service solutions — under the KK, 棒直播 and 米乐 brands. Backed by Qiming
  Venture Partners (启明创投), Sequoia China (红杉资本), CMC Capital (华人文化基金) and
  Shanda Capital (盛大资本). KK Live is a business-to-consumer product: as of this
  enrichment pass it publishes no public developer portal, API documentation,
  SDKs or machine-readable API specifications.
